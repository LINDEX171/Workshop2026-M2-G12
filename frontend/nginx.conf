# Sert l'application React et relaie les appels /api vers les services internes.
# En démo, le WAF est placé devant : navigateur -> waf:443 -> frontend:8080.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # DNS Docker + upstreams en variables : Nginx démarre même si un service
    # est absent (profil Compose partiel) et suit ses redémarrages.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth_upstream   http://auth:8000;
    set $pay_upstream    http://payment-api:8000;
    set $status_upstream http://detector:8000;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout    10s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"frontend","deps":{}}';
    }

    # Les métriques internes ne sont jamais exposées à l'extérieur
    location ~ ^/api/(auth|pay)/metrics {
        return 404;
    }

    location /api/auth/ {
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass $auth_upstream;
    }

    location /api/pay/ {
        rewrite ^/api/pay/(.*)$ /$1 break;
        proxy_pass $pay_upstream;
    }

    # Agrégateur lecture seule (detector) : seul /status est exposé
    location = /api/status {
        rewrite ^ /status break;
        proxy_pass $status_upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
