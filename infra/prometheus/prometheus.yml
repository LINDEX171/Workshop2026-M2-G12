# Prometheus — collecte des métriques de toute la plateforme.
# Nom de job = nom de service (label `job` dans Grafana et dans les alertes).
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # --- Microservices FastAPI (/metrics via prometheus-fastapi-instrumentator) ---
  - job_name: auth
    static_configs:
      - targets: ["auth:8000"]
  - job_name: payment-api
    static_configs:
      - targets: ["payment-api:8000"]
  - job_name: detector
    static_configs:
      - targets: ["detector:8000"]
  - job_name: remediator
    static_configs:
      - targets: ["remediator:8000"]
  - job_name: assistant
    static_configs:
      - targets: ["assistant:8000"]

  # --- Infrastructure ---
  - job_name: cadvisor          # CPU / RAM par conteneur
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: postgres-exporter # connexions, transactions Postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
